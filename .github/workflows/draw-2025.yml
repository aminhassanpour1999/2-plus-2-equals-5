name: Draw phrase on the 2025 contribution graph

on:
  workflow_dispatch:
    inputs:
      author_email:
        description: "Email address verified on your GitHub account"
        required: true
        type: string
      confirm_2025:
        description: "Type exactly 2025 to confirm the target year"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: draw-2025-artwork
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target year
        env:
          CONFIRM_YEAR: ${{ inputs.confirm_2025 }}
        run: |
          if [[ "$CONFIRM_YEAR" != "2025" ]]; then
            echo "::error::Confirmation must be exactly 2025. No commits were created."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure commit identity
        env:
          AUTHOR_EMAIL: ${{ inputs.author_email }}
          AUTHOR_NAME: ${{ github.actor }}
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

      - name: Verify the plan before writing history
        run: python two_plus_two.py

      - name: Create the 2025 pixel commits
        run: python two_plus_two.py --execute

      - name: Push the dated commits to main
        run: git push origin HEAD:main
